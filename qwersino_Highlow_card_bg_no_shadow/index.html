<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>트럼프 카드 High &amp; Low 게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game-container">
    <div class="title-row">
        <h1>High-LOW GAME</h1>

    </div>

    <div class="dashboard">
        <div class="dash-item">
            <span class="dash-label">보유 포인트</span>
            <span id="total-points" class="dash-value">10,000</span>
        </div>
        <div class="dash-item">
            <span class="dash-label">현재 배율</span>
            <span id="multiplier" class="dash-value">1.0x</span>
        </div>
        <div class="dash-item">
            <span class="dash-label">예상 획득</span>
            <span id="payout" class="dash-value highlight">0</span>
        </div>
    </div>

    <div class="main-row">
        <div class="card-area">
            <div id="card" class="card black">
                <div class="card-corner top">
                    <span id="card-val-top">?</span>
                    <span id="card-suit-top">♠</span>
                </div>
                <div id="card-suit-center" class="card-center-suit">♠</div>
                <div class="card-corner bottom">
                    <span id="card-val-bottom">?</span>
                    <span id="card-suit-bottom">♠</span>
                </div>
            </div>
        </div>

        <div class="panel-right">
            <div class="betting-section">
                <div class="bet-summary">
                    <div>현재 배팅</div>
                    <strong id="bet-total">0</strong><span> 포인트</span>
                </div>
                <div class="betting-actions">
                    <button id="clear-bet-btn" class="btn-clear-bet" onclick="clearBet()">배팅 초기화</button>
                    <button id="start-btn" class="btn-start" onclick="startGame()" disabled>게임 시작</button>
                </div>
            </div>

            <button id="cashout-btn" class="btn-cashout" onclick="cashOut()" disabled>💰 중간 정산 (수령하기)</button>
        </div>
    </div>

    <div class="chip-bar">
        <div class="chip-bar-title">CHIP BET</div>
        <div class="chip-tray">
            <button class="chip chip-500" data-value="500" onclick="addChip(500)"><span>500</span></button>
            <button class="chip chip-1000" data-value="1000" onclick="addChip(1000)"><span>1,000</span></button>
            <button class="chip chip-2500" data-value="2500" onclick="addChip(2500)"><span>2,500</span></button>
            <button class="chip chip-5000" data-value="5000" onclick="addChip(5000)"><span>5,000</span></button>
        </div>
        <div class="selected-bets">
            <div class="selected-title">내가 건 칩</div>
            <div id="selected-chips" class="selected-chips"><span class="empty-chip-message">아직 배팅한 칩이 없습니다.</span></div>
        </div>
    </div>

    <div class="game-actions">
        <button id="low-btn" class="btn-guess" onclick="makeGuess('low')" disabled>낮음 <span class="mult-tag">+0.25x / -0.25x</span></button>
        <button id="equal-btn" class="btn-guess" onclick="makeGuess('equal')" disabled>같음 <span class="mult-tag">+1.00x / -1.00x</span></button>
        <button id="high-btn" class="btn-guess" onclick="makeGuess('high')" disabled>높음 <span class="mult-tag">+0.25x / -0.25x</span></button>
        <button id="skip-btn" class="btn-guess btn-skip" onclick="skipCard()" disabled>스킵 <span id="skip-count" class="mult-tag">2회</span></button>
    </div>
</div>

<div id="result-overlay" class="result-overlay" aria-hidden="true">
    <div id="result-overlay-content" class="result-overlay-content">
        <div id="result-overlay-arrow" class="result-overlay-arrow">↑</div>
        <div id="result-overlay-text" class="result-overlay-text">+0.25x</div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
